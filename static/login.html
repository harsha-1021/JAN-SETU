<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policymaker Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A3A;
    --paper: #EAE7DD;
    --paper-raised: #F2F0E7;
    --brass: #A8763E;
    --teal: #3E6B63;
    --brick: #A13D2B;
    --slate: #5B6B6F;
    --line: rgba(27, 42, 58, 0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(380px, calc(100% - 40px));
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 36px 32px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 26px;
  }
  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--teal); }
  button {
    width: 100%;
    padding: 11px 16px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 5px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--teal); }
  button:disabled { opacity: 0.6; cursor: default; }
  #error {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 5px;
    background: rgba(161,61,43,0.08);
    border: 1px solid var(--brick);
    color: var(--brick);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Digital Public Infrastructure</div>
  <h1>Policymaker Login</h1>

  <form id="login-form">
    <label for="username">Email or username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="submit-btn">Log in</button>
    <div id="error"></div>
  </form>
</div>

<script type="module">
  import { signInPolicymaker } from '/dashboard/cloud-client.js';

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      await signInPolicymaker(
        document.getElementById('username').value.trim(),
        document.getElementById('password').value,
      );
      window.location.href = '/dashboard/';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>

</body>
</html>
